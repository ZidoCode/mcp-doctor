name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest && pytest -q

  installed:
    # Same suite, but against a real installed distribution: this is the only
    # job that exercises the metadata branch of _version() and the console
    # scripts that users actually invoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: both console scripts exist and report the built version
        run: |
          set -euo pipefail
          mcp-doctor --version
          mcpmedic --version
          ! mcp-doctor --version | grep -q unknown
          ! mcpmedic --version | grep -q unknown
      - name: reported version matches pyproject
        run: |
          python - <<'PY'
          import os, subprocess, sys, tomllib
          bindir = os.path.dirname(sys.executable)
          expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          for script in ("mcp-doctor", "mcpmedic"):
              exe = os.path.join(bindir, script)
              got = subprocess.check_output([exe, "--version"], text=True).strip()
              assert got == f"{script} {expected}", f"{got!r} != {script} {expected!r}"
              print("ok:", got)
          PY
      - run: pytest -q
      - name: built sdist ships only pinned contents
        run: |
          set -euo pipefail
          pip install build
          python -m build --sdist --outdir /tmp/sdist-probe >/dev/null
          python - <<'PY'
          import glob, sys, tarfile
          f = sorted(glob.glob("/tmp/sdist-probe/*.tar.gz"))[-1]
          names = tarfile.open(f).getnames()
          bad = [n for n in names if n.endswith("/ci.yml") or "/.github/" in n]
          expected = {
              "mcp_doctor.py", "mcp_session_audit.py", "mcp_schema_audit.py",
              "mcp_collision.py", "recording_io.py", "test_mcp_doctor.py",
              "test_exit_codes.py", "test_hardening.py", "README.md",
              "LICENSE", "CHANGELOG.md", "SECURITY.md", ".gitignore",
              "pyproject.toml",
          }
          got = {n.split("/", 1)[1] for n in names if "/" in n}
          missing = expected - got
          extra = got - expected - {"PKG-INFO"}
          if bad or missing or extra:
              sys.exit(f"sdist content mismatch in {f}: "
                       f"bad={bad} missing={sorted(missing)} extra={sorted(extra)}")
          print("ok: sdist clean,", len(names), "entries")
          PY
